name = "carepass-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare アカウント明示
# (D1 migrations apply で 'given account is not valid' (code: 7403) エラーを
#  防ぐため。wrangler が複数アカウントを見えていても、これで Workers / D1 と
#  もに同じアカウントに紐付けられる。)
account_id = "b9de28abfd009bbf696ceec4da62c5b8"

# カスタムドメイン: carepass-api.115en.com (Cloudflare の Custom Domain で割当済)

[vars]
SQUARE_ENV = "production"
SITE_BASE_URL = "https://carepass.115en.com"
MAIL_FROM = "Care Support Pass <no-reply@carepass.tamjump.com>"
MAIL_ADMIN = "tiger@115en.com"

# === Cloudflare D1 binding ===
# 初回作成手順 (ユーザーPCで実行):
#   cd worker
#   npx wrangler d1 create carepass-db
#   # 出力された database_id を下の database_id に貼る
#   npx wrangler d1 migrations apply carepass-db --remote
[[d1_databases]]
binding = "DB"
database_name = "carepass-db"
database_id = "5f4e840e-28e2-4c8a-9c8d-1b70bee44d89"
migrations_dir = "migrations"

# === secrets (wrangler secret put で設定) ===
# 既存 (v6.5までに設定済):
#   SQUARE_ACCESS_TOKEN
#   SQUARE_LOCATION_ID
#   SQUARE_WEBHOOK_SIGNATURE_KEY
#   SQUARE_APPLICATION_ID
#   PLAN_VARIATION_IDS_JSON
#   FACILITIES_JSON
#   ALLOWED_ORIGIN
#   WEBHOOK_NOTIFICATION_URL
#
# Phase 1 で追加:
#   MAIL_API_TOKEN                   (tamjump-contact-api と共通の service-to-service トークン.
#                                     tamjump-contact-api 側の INTERNAL_TOKEN と同じ値を投入する)
#
# Phase 2 で追加:
#   COUPON_HMAC_KEY                  (クーポン QR 短期トークンの HMAC-SHA256 鍵.
#                                     32 byte以上のランダム文字列を投入する)

# === Cron Triggers (定期実行) ===
# 報告書URL ヘルスチェック: 週1回、UTC日曜15時 (JST月曜0時)
# 公開済み (published) と 切断中 (broken) の facility_reports を全件チェックし、
# 到達不能なものは broken に、復活したものは published に戻す。
# src/index.js の scheduled() ハンドラ → runReportHealthCheck() で実装。
[triggers]
crons = ["0 15 * * 0"]
