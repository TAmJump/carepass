<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#2F7D5C" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2F7D5C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand mark -->
  <g transform="translate(80,80)">
    <circle cx="22" cy="22" r="22" fill="#2F7D5C"/>
    <circle cx="22" cy="22" r="14" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="22" cy="22" r="6" fill="#FFFFFF"/>
    <text x="58" y="30" font-family="'Noto Sans JP','Inter',sans-serif" font-size="22" font-weight="700" fill="#1F2933">Care Support Pass</text>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="240" font-family="'Inter',sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#2F7D5C">CONCEPT</text>

  <!-- Main title -->
  <text x="80" y="320" font-family="'Noto Sans JP',sans-serif" font-size="78" font-weight="700" fill="#1F2933">月100円で、</text>
  <text x="80" y="420" font-family="'Noto Sans JP',sans-serif" font-size="78" font-weight="700" fill="#1F2933">社会の支え方を変える。</text>

  <!-- Subtitle -->
  <text x="80" y="500" font-family="'Noto Sans JP',sans-serif" font-size="26" font-weight="500" fill="#5F6B73">先輩世代の住まいと暮らしを、地域で支える新しい生活インフラ。</text>

  <!-- Decorative line -->
  <line x1="80" y1="560" x2="200" y2="560" stroke="#2F7D5C" stroke-width="3"/>

  <!-- URL -->
  <text x="80" y="595" font-family="'Inter',sans-serif" font-size="18" font-weight="500" fill="#8A949B">carepass.115en.com</text>
</svg>
