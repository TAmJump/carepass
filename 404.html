<style>
.err{
  min-height:80vh;
  padding:120px 24px;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 500px at 50% -10%,rgba(233,68,54,.06),transparent 60%),#fff;
}
.err-card{max-width:540px;text-align:center}
.err-code{
  font-family:'Inter',sans-serif;
  font-size:120px;line-height:1;font-weight:800;
  letter-spacing:-.04em;color:var(--accent);
  margin:0 0 16px;
}
.err-card h1{
  font-size:clamp(22px,2.6vw,28px);
  font-weight:700;margin:0 0 16px;color:var(--ink);
}
.err-card p{
  font-size:14.5px;line-height:1.95;color:var(--sub);
  margin:0 0 36px;
}
.err-quick{
  background:var(--soft);border:1px solid var(--line);
  border-radius:14px;padding:24px;margin:0 0 32px;text-align:left;
}
.err-quick h3{font-size:13px;font-weight:600;margin:0 0 12px;color:var(--ink);text-transform:uppercase;letter-spacing:.1em}
.err-quick a{
  display:inline-block;font-size:13.5px;
  padding:4px 0;margin-right:14px;
}
.cta-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
